<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Confidence Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="container-fluid dashboard-container">


        <header class="dashboard-header">

            <div class="brand">

                <span class="brand-dot"></span>

                <div>

                    <h5>CONFIDENCE AI</h5>

                    <span>
                        REAL-TIME ANALYSIS SYSTEM
                    </span>

                </div>

            </div>


            <div class="system-status">

                <span class="status-dot"></span>

                <span id="statusText">
                    SYSTEM READY
                </span>

            </div>

        </header>



        <main class="row g-4 mt-1">


            <div class="col-lg-7">

                <section class="dashboard-panel camera-panel">


                    <div class="panel-header">

                        <span>
                            LIVE CAMERA FEED
                        </span>


                        <div class="d-flex align-items-center gap-2">

                            <button
                                id="meshToggle"
                                class="btn btn-sm btn-outline-secondary"
                            >

                                <i class="bi bi-eye"></i>

                                MESH ON

                            </button>


                            <span id="cameraStatus">
                                READY
                            </span>

                        </div>

                    </div>



                    <div class="camera-wrapper">


                        <video
                            id="webcam"
                            autoplay
                            playsinline
                        >
                        </video>


                        <canvas id="canvas"></canvas>


                        <div class="camera-overlay">

                            <span>

                                <i class="bi bi-camera-video"></i>

                                LIVE ANALYSIS

                            </span>

                        </div>


                    </div>


                </section>

            </div>



            <div class="col-lg-5">

                <div class="metrics-column">


                    <section class="dashboard-panel confidence-panel">


                        <div class="panel-header">

                            <span>
                                CONFIDENCE SCORE
                            </span>

                        </div>


                        <div class="confidence-content">


                            <div>

                                <div
                                    id="confidenceScore"
                                    class="confidence-score"
                                >
                                    0%
                                </div>


                                <span class="metric-label">
                                    CURRENT CONFIDENCE
                                </span>

                            </div>


                            <div
                                id="confidenceStatus"
                                class="confidence-status"
                            >
                                WAITING
                            </div>


                        </div>


                        <div
                            class="progress confidence-progress"
                        >

                            <div
                                id="confidenceBar"
                                class="progress-bar"
                                style="width: 0%"
                            >
                            </div>

                        </div>


                    </section>



                    <section class="dashboard-panel">


                        <div class="panel-header">

                            <span>
                                FACIAL METRICS
                            </span>

                        </div>



                        <div class="metrics-list">


                            <div class="metric-item">

                                <div class="metric-top">

                                    <span>
                                        HEAD POSITION
                                    </span>

                                    <strong id="headPitch">
                                        0%
                                    </strong>

                                </div>


                                <div class="progress">

                                    <div
                                        id="headPitchBar"
                                        class="progress-bar"
                                        style="width: 0%"
                                    >
                                    </div>

                                </div>

                            </div>



                            <div class="metric-item">

                                <div class="metric-top">

                                    <span>
                                        MOUTH CURVE
                                    </span>

                                    <strong id="mouthCurve">
                                        0%
                                    </strong>

                                </div>


                                <div class="progress">

                                    <div
                                        id="mouthCurveBar"
                                        class="progress-bar"
                                        style="width: 0%"
                                    >
                                    </div>

                                </div>

                            </div>



                            <div class="metric-item">

                                <div class="metric-top">

                                    <span>
                                        BROW HEIGHT
                                    </span>

                                    <strong id="browHeight">
                                        0%
                                    </strong>

                                </div>


                                <div class="progress">

                                    <div
                                        id="browHeightBar"
                                        class="progress-bar"
                                        style="width: 0%"
                                    >
                                    </div>

                                </div>

                            </div>



                            <div class="metric-item">

                                <div class="metric-top">

                                    <span>
                                        EYE OPENNESS
                                    </span>

                                    <strong id="eyeOpenness">
                                        0%
                                    </strong>

                                </div>


                                <div class="progress">

                                    <div
                                        id="eyeOpennessBar"
                                        class="progress-bar"
                                        style="width: 0%"
                                    >
                                    </div>

                                </div>

                            </div>



                            <div class="metric-item">

                                <div class="metric-top">

                                    <span>
                                        EYE ATTENTION
                                    </span>

                                    <strong id="eyeAttention">
                                        0%
                                    </strong>

                                </div>


                                <div class="progress">

                                    <div
                                        id="eyeAttentionBar"
                                        class="progress-bar"
                                        style="width: 0%"
                                    >
                                    </div>

                                </div>

                            </div>


                        </div>


                    </section>



                    <section class="dashboard-panel">


                        <div class="panel-header">

                            <span>
                                ANALYSIS STATUS
                            </span>

                        </div>


                        <div class="system-info">


                            <div class="info-item">

                                <span>
                                    STATUS
                                </span>

                                <strong id="analysisStatus">
                                    WAITING
                                </strong>

                            </div>


                            <div class="info-item">

                                <span>
                                    DETECTION
                                </span>

                                <strong id="faceStatus">
                                    NO FACE
                                </strong>

                            </div>


                        </div>


                    </section>


                </div>

            </div>


        </main>



        <footer class="control-panel">


            <button
                id="startButton"
                class="btn btn-primary"
            >

                <i class="bi bi-play-fill"></i>

                START ANALYSIS

            </button>



            <button
                id="stopButton"
                class="btn btn-outline-secondary"
            >

                <i class="bi bi-stop-fill"></i>

                STOP

            </button>



            <button
                id="resetButton"
                class="btn btn-outline-secondary"
            >

                <i class="bi bi-arrow-counterclockwise"></i>

                RESET

            </button>


        </footer>


    </div>


    <script
        src="{{ url_for('static', filename='script.js') }}"
    >
    </script>


</body>

</html>
